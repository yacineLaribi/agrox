{% load static %}
<div x-data="chatBotWidget()" class="">
    <!-- Floating Chat Icon -->
    <div class="fixed bottom-6 right-6 z-50">
        <button @click="toggleChat()" 
                class="w-14 h-14 bg-green-600 hover:from-green-500 text-white rounded-full shadow-lg  transition-all duration-300  flex items-center justify-center group">
            <!-- Chat Icon -->
            <svg x-show="!chatOpen" 
                class="w-6 h-6 transition-transform duration-200" 
                fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M7 8h10M7 12h6m5 8l-4-4H7a4 4 0 01-4-4V8a4 4 0 014-4h10a4 4 0 014 4v8a4 4 0 01-4 4z" />
            </svg>

            <!-- Close Icon -->
            <svg x-show="chatOpen" class="w-6 h-6 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
        
        <!-- Notification Badge -->
        <div x-show="!chatOpen && hasNewMessage" 
             class="absolute -top-2 -right-2 w-5 h-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center animate-pulse">
            1
        </div>
    </div>
    <!-- Chat Popup Window -->
    <div x-show="chatOpen" 
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 transform translate-y-4 scale-95"
        x-transition:enter-end="opacity-100 transform translate-y-0 scale-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 transform translate-y-0 scale-100"
        x-transition:leave-end="opacity-0 transform translate-y-4 scale-95"
        :class="expanded 
            ? 'fixed bottom-24 right-6 w-[90vw] md:w-[80vw] h-[80vh]' 
            : 'fixed bottom-24 right-2 md:right-6 md:w-96 h-[500px]'"
        class="bg-white rounded-2xl shadow-2xl border border-slate-200 
                 z-40 flex flex-col overflow-hidden transition-all duration-300 ease-in-out"
        style="display: none;">

        
        <!-- Chat Header -->
        <div class="bg-white/80 backdrop-blur-sm px-6 py-4 border-b border-slate-200">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full flex items-center justify-center">
                    <img src="https://www.clipartmax.com/png/middle/96-968421_space-and-astronomy-robot-icon-transparent-background.png" alt="" class="w-8 h-8 object-cover text-white">
                </div>
                <div class="flex-1">
                    <h2 class="font-semibold text-slate-800">Fala7</h2>
                    <p class="text-sm text-slate-500">Assistant Intelligent d'agriculture</p>
                </div>
                <button @click="expanded = !expanded" 
                        class="text-slate-400 hover:text-slate-600">

                    <!-- Expand icon -->
                    <svg x-show="!expanded" xmlns="http://www.w3.org/2000/svg" 
                        class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <rect x="4" y="4" width="16" height="16" rx="2" ry="2"
                            stroke-width="2" stroke="currentColor" fill="none" />
                        <path d="M9 9h6v6H9z" stroke-width="2" />
                    </svg>

                    <!-- Collapse icon -->
                    <svg x-show="expanded" xmlns="http://www.w3.org/2000/svg" 
                        class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <rect x="4" y="4" width="16" height="16" rx="2" ry="2"
                            stroke-width="2" stroke="currentColor" fill="none" />
                        <path d="M7 7h10v10H7z" stroke-width="2" />
                    </svg>
                </button>


                <button @click="toggleChat()" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
        </div>

        <!-- Messages Container -->
        <div id="messages" class="flex-1 bg-white/50 backdrop-blur-sm flex flex-col space-y-4 p-4 overflow-y-auto scrollbar-thin scrollbar-thumb-slate-300  scrollbar-track-transparent hover:scrollbar-thumb-slate-400">
            <template x-for="(message, key) in messages">
                <div>
                    <div class="flex items-end gap-2" :class="message.from=='bot'?'':'justify-end'">
                        <!-- Avatar -->
                        <div :class="message.from=='bot'?'order-1':'order-3'" class="flex-shrink-0">
                            <div class="w-6 h-6 rounded-full overflow-hidden shadow-md" :class="message.from=='bot'?'bg-gradient-to-br from-blue-500 to-purple-600':'bg-gradient-to-br from-emerald-500 to-teal-600'">
                                <svg class="w-full h-full p-1 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path x-show="message.from=='bot'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                                    <path x-show="message.from!='bot'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                            </div>
                        </div>

                        <!-- Message Bubble -->
                        <div class="flex flex-col" :class="message.from=='bot'?'order-2 items-start':'order-2 items-end'">
                            <div class="relative px-3 py-2 rounded-xl shadow-sm transition-all duration-200 text-sm" 
                                 :class="message.from=='bot'?'bg-white  text-slate-700  rounded-bl-md border border-slate-200 ':'bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-br-md shadow-blue-500/25'">
                                <div class="leading-relaxed" x-html="message.text"></div>
                                <!-- Message tail -->
                                <div class="absolute w-2 h-2 transform rotate-45" 
                                     :class="message.from=='bot'?'-left-1 bottom-2 bg-white  border-l border-b border-slate-200 ':'-right-1 bottom-2 bg-blue-500'"></div>
                            </div>
                            <div class="text-xs text-slate-400  mt-1 px-2" x-text="new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'})"></div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Typing Indicator -->
            <div x-show="botTyping" style="display: none;" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 transform translate-y-2" x-transition:enter-end="opacity-100 transform translate-y-0">
                <div class="flex items-end gap-2">
                    <div class="w-6 h-6 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-md">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <div class="bg-white px-3 py-2 rounded-xl rounded-bl-md shadow-sm border border-slate-200 relative">
                        <div class="typing-indicator">
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                        </div>
                        <div class="absolute w-2 h-2 transform rotate-45 -left-1 bottom-2 bg-white border-l border-b border-slate-200"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-white/80  backdrop-blur-sm border-t border-slate-200  px-4 py-3">
            <div class="relative flex items-center gap-2">
                <div class="flex-1 relative">
                    <input id="hidden" type="hidden" value="web_search" x-ref="choice">
                    <input type="text" 
                           placeholder="Posez votre question..." 
                           autocomplete="off" 
                           @keydown.enter="updateChat($event.target)" 
                           class="w-full px-3 py-2 pr-10 bg-slate-50  border border-slate-200  rounded-lg text-slate-700  placeholder-slate-400  focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 text-sm" 
                           x-ref="input" />
                    <div class="absolute right-2 top-1/2 transform -translate-y-1/2">
                        <button type="button" 
                                class="w-6 h-6 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white rounded-md flex items-center justify-center transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 shadow-sm" 
                                @click.prevent="updateChat($refs.input)">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <div class="flex items-center justify-between mt-2 text-xs text-slate-400 dark:text-slate-500">
                <span>Appuyez sur Entrée</span>
                <span class="flex items-center gap-1">
                    <div class="w-1.5 h-1.5 bg-green-400 rounded-full animate-pulse"></div>
                    En ligne
                </span>
            </div>
        </div>
    </div>
</div>

<style>
    @import url('https://cdnjs.cloudflare.com/ajax/libs/MaterialDesign-Webfont/5.3.45/css/materialdesignicons.min.css');
    
    .typing-indicator {
        display: flex;
        align-items: center;
        gap: 3px;
        padding: 6px 0;
    }
    
    .dot {
        width: 4px;
        height: 4px;
        background-color: #64748b;
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out;
    }
    
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    .dot:nth-child(3) { animation-delay: 0s; }
    
    @keyframes bounce {
        0%, 80%, 100% {
            transform: scale(0.8);
            opacity: 0.5;
        }
        40% {
            transform: scale(1);
            opacity: 1;
        }
    }

    /* Custom scrollbar */
    .scrollbar-thin {
        scrollbar-width: thin;
    }
    
    .scrollbar-thumb-slate-300::-webkit-scrollbar-thumb {
        background-color: rgb(203 213 225);
        border-radius: 0.375rem;
    }
    
    .scrollbar-track-transparent::-webkit-scrollbar-track {
        background-color: transparent;
    }
    
    .scrollbar-thin::-webkit-scrollbar {
        width: 4px;
    }

    /* Dark mode scrollbar */
    .dark .scrollbar-thumb-slate-600::-webkit-scrollbar-thumb {
        background-color: rgb(71 85 105);
    }
</style>

<!-- Load external libraries first (Showdown is required for markdown conversion) -->
<script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>

<!-- Define the function -->
<script>
    function chatBotWidget() {
        return {
            chatOpen: false,
            botTyping: false,
            hasNewMessage: false,
            expanded: false,
            // Added userInput to match previous logic, although x-ref/target is used
            userInput: '', 

            messages: [{
                from: 'bot',
                text: 'Bonjour ! 👋 Je suis Fala7, votre assistant intelligent d\'agriculture. Posez-moi une question liée à l\'agriculture, et je vous fournirai des informations fiables.'  
            }],
            
            toggleChat() {
                this.chatOpen = !this.chatOpen;
                if (this.chatOpen) {
                    this.hasNewMessage = false;
                    // Focus input when chat opens
                    this.$nextTick(() => {
                        if (this.$refs.input) {
                            this.$refs.input.focus();
                        }
                    });
                }
            },
            
            output: function(input) {
                // Add user message
                this.messages.push({
                    from: 'user',
                    text: input
                });
                this.scrollChat();

                // Show typing indicator after delay
                setTimeout(() => {
                    this.botTyping = true;
                    this.scrollChat();
                }, 800);

                // Send the user message to the Django backend
                const choice = document.querySelector("#hidden").value
                fetch("{% url 'core:chat_with_bot' %}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    // NOTE: This includes mode_choice, which your Python view should handle if it expects it.
                    body: JSON.stringify({ message: input, mode_choice: choice })
                })
                .then(response => response.json())
                .then(data => {
                    // Handle the response from the backend
                    this.botTyping = false;
                    
                    if (data.error) {
                         this.messages.push({
                            from: 'bot',
                            text: '❌ Erreur Serveur: ' + data.error
                        });
                        this.scrollChat();
                        return;
                    }
                    
                    // Convert markdown to HTML using showdown
                    const converter = new showdown.Converter();
                    const htmlResponse = converter.makeHtml(data.response);
                    
                    setTimeout(() => {
                        this.messages.push({
                            from: 'bot',
                            text: htmlResponse
                        });
                        this.scrollChat();
                        
                        // Show notification if chat is closed
                        if (!this.chatOpen) {
                            this.hasNewMessage = true;
                        }
                    }, 300);
                })
                .catch(error => {
                    console.error('Error:', error);
                    this.botTyping = false;
                    this.messages.push({
                        from: 'bot',
                        text: '❌ Désolé, une erreur s\'est produite. Veuillez réessayer.'
                    
                    });
                    this.scrollChat();
                });
            },
            
            scrollChat: function() {
                this.$nextTick(() => {
                    const messagesContainer = document.getElementById("messages");
                    if (messagesContainer) {
                        messagesContainer.scrollTo({
                            top: messagesContainer.scrollHeight,
                            behavior: "smooth"
                        });
                    }
                });
            },
            
            updateChat: function(target) {
                // target can be the DOM element from @keydown.enter ($event.target)
                // or the x-ref element from the @click ($refs.input)
                if (target && target.value.trim()) {
                    const message = target.value.trim();
                    this.output(message);
                    target.value = ''; // Clear the input field
                }
            }
        }
    }
</script>
