<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - AGROX</title>
    <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://unpkg.com/lucide@latest"></script>

</script>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="{% url "core:home" %}" class="flex-shrink-0 flex items-center gap-2">
                    <i data-lucide="leaf" class="h-8 w-8 text-green-600"></i>
                    <span class="font-bold text-xl tracking-tight text-gray-900">AGROX</span>
                    </a>
                </div>
                <div class="flex items-center gap-4">
                    <a href="index.html" class="text-gray-600 hover:text-green-600">Back to Home</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Auth Container -->
    <div class="mt-28 flex items-center justify-center px-4 sm:px-6 lg:px-8">
        <div class="w-full max-w-md">
            <!-- Logo Section -->
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-gray-900 mb-2">Welcome Back</h1>
                <p class="text-gray-600">Sign in to your AGROX farm account</p>
            </div>

            <!-- Login Form -->
            <div class="bg-white rounded-lg border border-gray-200 p-8">
                <form class="space-y-6" method="post" action="{% url 'core:login' %}">
                    {% csrf_token %}
                    <!-- Email -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                        <input name="email" type="email" placeholder="your@email.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                        <input name="password" type="password" placeholder="••••••••" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="flex justify-between items-center text-sm">
                        <label class="flex items-center gap-2">
                            <input type="checkbox" class="w-4 h-4 border-gray-300 rounded text-green-600">
                            <span class="text-gray-700">Remember me</span>
                        </label>
                        <a href="#" class="text-green-600 hover:underline">Forgot password?</a>
                    </div>

                    <!-- Sign In Button -->
                    <button type="submit" class="w-full px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 font-semibold transition">
                        Sign In
                    </button>
                </form>

            </div>

            <!-- Sign Up Link -->
            <p class="text-center text-gray-600 mt-6">
                Don't have an account?
                <a href="{% url 'core:signup' %}" class="text-green-600 font-semibold hover:underline">Sign up</a>
            </p>
        </div>
    </div>
</body>
</html>
