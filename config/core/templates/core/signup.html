
{% extends "base.html" %}
{% block content %}

    <!-- Auth Container -->
    <div class="min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12">
        <div class="w-full max-w-md">
            <!-- Logo Section -->
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-gray-900 mb-2">Get Started</h1>
                <p class="text-gray-600">Create your AGROX farm account today</p>
            </div>

            <!-- Signup Form -->
            <div class="bg-white rounded-lg border border-gray-200 p-8">
                <form class="space-y-4" method="post" action="{% url 'core:signup' %}">
                    <!-- Full Name -->
                     {% csrf_token %}
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
                        <input name="fullname" type="text" placeholder="John Farmer" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                        <input name="email" type="email" placeholder="your@email.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>

                    <!-- Phone Number -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Phone Number</label>
                        <input name="phone" type="tel" placeholder="+213 6XXXXXXXX" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>

                    <!-- Region (Wilaya) -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Region (Wilaya)</label>
                        <select name="region" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option value="">Select your wilaya</option>
                            <option value="Adrar">Adrar</option>
                            <option value="Chlef">Chlef</option>
                            <option value="Laghouat">Laghouat</option>
                            <option value="Oum El Bouaghi">Oum El Bouaghi</option>
                            <option value="Batna">Batna</option>
                            <option value="Bejaia">Bejaia</option>
                            <option value="Biskra">Biskra</option>
                            <option value="Bechar">Bechar</option>
                            <option value="Blida">Blida</option>
                            <option value="Bouira">Bouira</option>
                            <option value="Tamanrasset">Tamanrasset</option>
                            <option value="Tebessa">Tebessa</option>
                            <option value="Tlemcen">Tlemcen</option>
                            <option value="Tiaret">Tiaret</option>
                            <option value="Tizi Ouzou">Tizi Ouzou</option>
                            <option value="Alger">Alger</option>
                            <option value="Djelfa">Djelfa</option>
                            <option value="Jijel">Jijel</option>
                            <option value="Setif">Setif</option>
                            <option value="Saida">Saida</option>
                            <option value="Skikda">Skikda</option>
                            <option value="Sidi Bel Abbes">Sidi Bel Abbes</option>
                            <option value="Annaba">Annaba</option>
                            <option value="Guelma">Guelma</option>
                            <option value="Constantine">Constantine</option>
                            <option value="Medea">Medea</option>
                            <option value="Mostaganem">Mostaganem</option>
                            <option value="M'Sila">M'Sila</option>
                            <option value="Mascara">Mascara</option>
                            <option value="Ouargla">Ouargla</option>
                            <option value="Oran">Oran</option>
                            <option value="El Bayadh">El Bayadh</option>
                            <option value="Illizi">Illizi</option>
                            <option value="Bordj Bou Arreridj">Bordj Bou Arreridj</option>
                            <option value="Boumerdes">Boumerdes</option>
                            <option value="El Tarf">El Tarf</option>
                            <option value="Tindouf">Tindouf</option>
                            <option value="Tissemsilt">Tissemsilt</option>
                            <option value="El Oued">El Oued</option>
                            <option value="Khenchela">Khenchela</option>
                            <option value="Souk Ahras">Souk Ahras</option>
                            <option value="Tipaza">Tipaza</option>
                            <option value="Mila">Mila</option>
                            <option value="Ain Defla">Ain Defla</option>
                            <option value="Naama">Naama</option>
                            <option value="Ain Temouchent">Ain Temouchent</option>
                            <option value="Ghardaia">Ghardaia</option>
                            <option value="Relizane">Relizane</option>
                            <option value="Timimoun">Timimoun</option>
                            <option value="Bordj Badji Mokhtar">Bordj Badji Mokhtar</option>
                            <option value="Ouled Djellal">Ouled Djellal</option>
                            <option value="Beni Abbes">Beni Abbes</option>
                            <option value="In Salah">In Salah</option>
                            <option value="In Guezzam">In Guezzam</option>
                            <option value="Touggourt">Touggourt</option>
                            <option value="Djanet">Djanet</option>
                            <option value="El M'Ghair">El M'Ghair</option>
                            <option value="El Menia">El Menia</option>
                        </select>
                    </div>

                    <!-- Farm Name -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Farm Name</label>
                        <input name="farm" type="text" placeholder="Green Valley Farm" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                        <input name="password" type="password" placeholder="••••••••" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>

                    <!-- Confirm Password -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Confirm Password</label>
                        <input name="password2" type="password" placeholder="••••••••" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>

                    <!-- Terms Checkbox -->
                    <label class="flex items-start gap-2 text-sm">
                        <input type="checkbox" class="w-4 h-4 border-gray-300 rounded text-green-600 mt-0.5">
                        <span class="text-gray-700">I agree to the <a href="#" class="text-green-600 hover:underline">Terms of Service</a> and <a href="#" class="text-green-600 hover:underline">Privacy Policy</a></span>
                    </label>

                    <!-- Sign Up Button -->
                    <button type="submit" class="w-full px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 font-semibold transition mt-6">
                        Create Account
                    </button>
                </form>

            </div>

            <!-- Sign In Link -->
            <p class="text-center text-gray-600 mt-6">
                Already have an account?
                <a href="login.html" class="text-green-600 font-semibold hover:underline">Sign in</a>
            </p>
        </div>
    </div>

{% endblock content %}
